# ============================================================================
#  PelakX — پلاک ۳: پروفایل پیش‌فرض (میانه)
#  منطق پردازش دقیقاً همان "پلاک ۱" است — هر فریم پردازش می‌شود، مسیر
#  پلاک/OCR/گرامر ایران دست‌نخورده. فقط دو پارامتر عوض می‌شوند، و هر دو فقط
#  روی تشخیص خودرو اثر می‌گذارند (مدل تشخیص پلاک این‌ها را نمی‌بیند):
#    - vehicle_model
#    - imgsz
#  یک سومی هم هست ولی دستی نیست: آستانه‌ی بزرگ‌نمایی pre-OCR (OCR_MIN_H) در
#  خود نوت‌بوک به‌طور خودکار و متناسب با imgsz محاسبه می‌شود
#  (OCR_MIN_H = 64 × imgsz/640)، چون هرچه imgsz بزرگ‌تر باشد ماشین‌های
#  دورتر/کوچک‌تری هم دیده می‌شوند که پلاکشان در پیکسل واقعی خیلی کوچک است.
#
#  ۴ پروفایل آماده در این پوشه، همه با همین منطق خودکار:
#    baseline_640.yaml (پلاک ۱، صفر تفاوت) | pelak3.yaml (این فایل، میانه)
#    highway.yaml (بزرگراه) | highway_far.yaml (بزرگراه/دوربین خیلی دور)
#
#  برای هر دوربین/ویدیوی خاص یک کپی از این فایل بسازید و مسیرش را در
#  notebooks/pelak_3.ipynb (متغیر CONFIG_PATH) عوض کنید.
# ============================================================================

# مدل تشخیص خودرو: yolo26n.pt (سریع/سبک، پیش‌فرض پلاک ۱) | yolo26s.pt (میانه) | yolo26m.pt (دقیق‌تر/سنگین‌تر)
vehicle_model: yolo26s.pt

# اندازه‌ی تصویر ورودی *فقط* مدل خودرو (imgsz).
#   640  → پیش‌فرض پلاک ۱ / خیابان‌های نزدیک   (OCR_MIN_H خودکار: 64)
#   960  → میانه (پیش‌فرض این پروفایل)          (OCR_MIN_H خودکار: 96)
#   1280 → بزرگراه                              (OCR_MIN_H خودکار: 128)
#   1600 → بزرگراه/دوربین خیلی دور              (OCR_MIN_H خودکار: 160)
imgsz: 960
