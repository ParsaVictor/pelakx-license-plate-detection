    slots: "LLLDLDD"
    groups: { head: [0, 3], d1: [3, 4], mid: [4, 5], tail: [5, 7] }
    display: "{head}{d1}{mid}{tail}"
    canonical: "{head}{d1}{mid}{tail}"
    priority: 110
  - id: legacy
    name_en: Legacy (ABC1234)
    slots: "LLLDDDD"
    groups: { head: [0, 3], serial: [3, 7] }
    display: "{head}-{serial}"
    canonical: "{head}{serial}"
    priority: 100
