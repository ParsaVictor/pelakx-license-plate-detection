# ============================================================================
#  PelakX country grammar — Islamic Republic of Iran  🇮🇷
#  گرامر پلاک خودروی ایران
# ============================================================================
code: IR
iso3: IRN
name_en: Iran
name_native: ایران
script: arabic            # writing system of the letter slot
text_direction: rtl       # direction of the *language*, not of the plate read order
read_order: ltr           # Iranian plates are read left-to-right, even in an RTL script
digit_style: fa           # plate is printed with Persian-Indic digits ۰۱۲۳۴۵۶۷۸۹

# Which OCR engines can read this country, in priority order.
# The pipeline walks the list and takes the first engine that is installed.
ocr_engines:
  preferred: [hezar_fa]
  fallback:  [paddle, easyocr, fast_plate]

# Words printed on the plate that are never part of the reading.
# Stripped after script folding, longest-first.
noise_words: [ایران, IRAN, IR]

alphabet:
  digits: "0123456789"
  # Multi-character letters (الف, معلولین, تشریفات) are matched greedily
  # by the tokenizer, longest-first.
  letters:
    - الف
    - ب
    - پ
    - ت
    - ث
    - ج
    - د
    - ز
    - ژ
    - س
    - ش
    - ص
    - ط
    - ع
    - ف
    - ق
    - ک
    - گ
    - ل
    - م
    - "ن"
    - و
    - ه
    - ی
    - D
    - S
    - معلولین
    - معلول    # OCR engines very rarely produce the full "معلولین"; without this
               # alias the tokenizer falls back to splitting it into 5 separate
               # single-char letter tokens (م ع ل و ل), which can never fit a
               # one-letter slot and silently fails to match any layout.
    - تشریفات
    - موقت     # marker word on temporary free-trade-zone plates (پلاک موقت),
               # see the free_zone_temp layout below. Treated as one letter
               # token the same way معلولین/تشریفات are.

# Plate layouts. `slots` drives both validation *and* confusion-repair:
#   D = digit slot,  L = letter slot,  A = alphanumeric slot
layouts:
  - id: civilian
    name_en: Standard vehicle plate
    name_native: پلاک شخصی/عمومی
    slots: "DDLDDDDD"
    # groups map slot ranges to named fields (start, end) — end exclusive
    groups:
      left:     [0, 2]    # ۲ رقم سمت چپ
      letter:   [2, 3]    # حرف
      right:    [3, 6]    # ۳ رقم سمت راست
      province: [6, 8]    # کد استان (ایران XX)
    display: "{left} {letter} {right} | ایران {province}"
    display_en: "{left}{letter}{right}-IR{province}"
    canonical: "{left}{letter}{right}{province}"
    priority: 100

  - id: motorcycle
    name_en: Motorcycle plate
    name_native: پلاک موتورسیکلت
    slots: "DDDDDDDD"
    groups:
      province: [0, 3]    # ۳ رقم بالا = کد استان/شهر
      serial:   [3, 8]    # ۵ رقم پایین
    display: "{province} - {serial}"
    display_en: "{province}-{serial}"
    canonical: "{province}{serial}"
    priority: 60

  - id: free_zone
    name_en: Free-trade-zone plate
    name_native: پلاک مناطق آزاد
    slots: "DDLDDDDD"
    groups:
      left:     [0, 2]
      letter:   [2, 3]
      right:    [3, 6]
      province: [6, 8]
    display: "{left} {letter} {right} | منطقه آزاد {province}"
    canonical: "{left}{letter}{right}{province}"
    priority: 40

  - id: free_zone_temp
    name_en: Temporary free-trade-zone plate
    name_native: پلاک موقت مناطق آزاد
    # Two printed lines — "NNNNN-NN" over "موقت - NN" — read by PelakX as one
    # flattened string (top line then bottom line; see Pipeline._read_two_line)
    # rather than true spatial two-line segmentation. A fixed `slots` pattern
    # is too brittle here: hezar_fa's CRNN is a plate-*character* recognizer,
    # not a word reader, so "موقت" almost never comes back as clean text —
    # it lands as 1-4 unpredictable letter-ish characters. A regex tolerates
    # that noise instead of requiring an exact token match: 9 digits (5-digit
    # serial + 2-digit sub + 2-digit province), then whatever the "موقت"
    # region OCR'd as.
    regex: '^(?P<serial>\d{5})(?P<sub>\d{2})(?P<province>\d{2})[^\d]{0,10}$'
    display: "{serial}-{sub} | موقت - {province}"
    canonical: "{serial}{sub}TEMP{province}"
    priority: 45

# Semantics of the letter slot. Partial on purpose — PRs welcome.
# TODO(community): complete + cite an official source for every entry.
letter_semantics:
  الف:      { en: Government,    fa: دولتی }
  پ:        { en: Police,        fa: پلیس }
  ت:        { en: Taxi,          fa: تاکسی }
  ع:        { en: IRGC,          fa: سپاه }
  D:        { en: Diplomatic,    fa: دیپلمات }
  S:        { en: Political,     fa: سیاسی }
  معلولین:  { en: Disabled/Veteran, fa: جانبازان و معلولین }
  معلول:    { en: Disabled/Veteran, fa: جانبازان و معلولین }  # OCR-friendly alias, see alphabet.letters
  تشریفات:  { en: Protocol,      fa: تشریفات }
  موقت:     { en: Temporary (free zone), fa: موقت منطقه آزاد }
  # NOTE on "گ" (added to alphabet.letters as an ordinary serial letter):
  # unlike الف/پ/ت/ع/D/S/معلولین/تشریفات above, "گ" is not documented in any
  # source we could verify as a distinct reserved-category letter — it is
  # used as a plain civilian serial letter in several provinces, the same as
  # ب/ج/د/س/ص/ط/ق/ل/م/ن/و/ه/ی. We deliberately did NOT add it here as a
  # "government" category: doing so on an unverified guess would print a
  # wrong, confident-looking label on real plates. If you have a citable
  # source that "گ" carries an official meaning, please open a PR.

# --- OCR confusion repair --------------------------------------------------
# When a character lands in a slot it cannot legally occupy, PelakX tries
# these substitutions (bounded search, see grammar/repair.py).
confusions:
  to_digit:
    { "O": "0", "o": "0", "Q": "0", "D": "0", "I": "1", "l": "1", "|": "1",
      "Z": "2", "z": "2", "E": "3", "A": "4", "S": "5", "s": "5", "G": "6",
      "b": "6", "T": "7", "B": "8", "g": "9", "q": "9",
      "۰": "0", "۱": "1", "۲": "2", "۳": "3", "۴": "4",
      "۵": "5", "۶": "6", "۷": "7", "۸": "8", "۹": "9" }
  to_letter:
    # visually similar Persian letters that OCR flips between
    { "ں": "ن", "ٮ": "ب", "ك": "ک", "ي": "ی", "ة": "ه", "أ": "الف",
      "إ": "الف", "آ": "الف", "ا": "الف" }

# --- Structural validators (run after a layout matches) --------------------
validators:
  - id: province_range
    applies_to: [civilian, free_zone]
    field: province
    type: int_range
    min: 10
    max: 99
    weight: 0.15          # how much passing this adds to the confidence score

  - id: nonzero_right
    applies_to: [civilian, free_zone]
    field: right
    type: not_equal
    value: "000"
    weight: 0.05

# Two-digit province ("ایران XX") lookup.
# Deliberately shipped empty rather than guessed — see docs/ADDING_A_COUNTRY.md
# for how to contribute a sourced table. `province_range` still validates it.
province_codes: {}
