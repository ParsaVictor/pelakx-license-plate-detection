code: TR
iso3: TUR
name_en: Turkiye
name_native: Turkiye
script: latin
text_direction: ltr
read_order: ltr
digit_style: latin
ocr_engines: { preferred: [fast_plate], fallback: [paddle, easyocr] }
alphabet:
  digits: "0123456789"
  letters: [A, B, C, D, E, F, G, H, I, J, K, L, M, N, O, P, R, S, T, U, V, Y, Z]
layouts:
  - id: standard
    name_en: Standard plate
    regex: '^(?P<province>\d{2})(?P<letters>[A-Z]{1,3})(?P<serial>\d{2,4})$'
    display: "{province} {letters} {serial}"
    canonical: "{province}{letters}{serial}"
    priority: 100
confusions:
  to_digit: { "O": "0", "Q": "0", "D": "0", "I": "1", "L": "1", "Z": "2", "S": "5", "B": "8", "G": "6" }
  to_letter: { "0": "O", "1": "I", "2": "Z", "5": "S", "8": "B", "6": "G" }
validators:
  - { id: province_range, applies_to: [standard], field: province, type: int_range, min: 1, max: 81, weight: 0.2 }
