code: GB
iso3: GBR
name_en: United Kingdom
name_native: United Kingdom
script: latin
text_direction: ltr
read_order: ltr
digit_style: latin
ocr_engines: { preferred: [fast_plate], fallback: [paddle, easyocr] }
alphabet:
  digits: "0123456789"
  letters: [A, B, C, D, E, F, G, H, J, K, L, M, N, O, P, R, S, T, U, V, W, X, Y]
layouts:
  - id: current
    name_en: Current format (since 2001)
    slots: "LLDDLLL"
    groups: { area: [0, 2], age: [2, 4], serial: [4, 7] }
    display: "{area}{age} {serial}"
    canonical: "{area}{age}{serial}"
    priority: 100
  - id: prefix
    name_en: Prefix format (1983-2001)
    regex: '^(?P<age>[A-Z])(?P<serial>\d{1,3})(?P<area>[A-Z]{3})$'
    display: "{age}{serial} {area}"
    canonical: "{age}{serial}{area}"
    priority: 60
confusions:
  to_digit: { "O": "0", "Q": "0", "D": "0", "I": "1", "L": "1", "Z": "2", "S": "5", "B": "8", "G": "6" }
  to_letter: { "0": "O", "1": "I", "2": "Z", "5": "S", "8": "B", "6": "G" }
validators:
  - { id: no_i_q_z, applies_to: [current], field: area, type: charset_excludes, value: "IQZ", weight: 0.1 }
