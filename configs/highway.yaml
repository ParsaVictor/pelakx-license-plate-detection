# ============================================================================
#  نمونه‌ی پروفایل بزرگراه — imgsz بزرگ‌تر برای خودروهای دور و کوچک.
#  OCR_MIN_H خودکار می‌شود 128 (= 64 × 1280/640)؛ مدل پلاک/OCR دست‌نخورده‌اند.
#  برای استفاده: در notebooks/pelak_3.ipynb مقدار CONFIG_PATH را به این فایل
#  تغییر دهید، یا این فایل را روی pelak3.yaml کپی کنید.
#  هنوز تست نشده — قبل از استفاده‌ی واقعی روی ویدیوی بزرگراه امتحانش کنید.
# ============================================================================

vehicle_model: yolo26s.pt
imgsz: 1280       # بزرگراه: خودروها دورتر و کوچک‌ترند
